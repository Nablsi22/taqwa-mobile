name: taqwa_mobile
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.13+15
environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2
  go_router: ^17.1.0
  dio: ^5.9.2
  retrofit: ^4.9.2
  flutter_secure_storage: ^10.0.0
  firebase_messaging: ^16.1.3
  firebase_core: ^4.6.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_svg: ^2.2.3
  google_fonts: ^8.0.2
  image_picker: ^1.2.1
  intl: ^0.20.2
  provider: ^6.1.5+1
  flutter_localizations:
    sdk: flutter
  path_provider: ^2.1.5
  quran: ^1.4.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.11.1
  retrofit_generator: ^10.2.1
  json_serializable: ^6.11.2
  mockito: ^5.6.3
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf
    - family: ArefRuqaa
      fonts:
        - asset: assets/fonts/ArefRuqaa-Bold.ttf
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700

flutter_launcher_icons:
  ios: true
  android: false
  remove_alpha_ios: true
  background_color_ios: "#1B4F72"
  image_path: "assets/icons/app_icon_1024.png"
